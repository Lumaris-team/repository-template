name: Repository Initialization

on:
  workflow_dispatch:
    inputs:
      skip:
        description: 'Skip issue creation (for testing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  initialization:
    runs-on: ubuntu-latest
    if: inputs.skip != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect repository structure
        id: detect
        run: |
          echo "detecting structure..."
          
          # Detect Cloudflare Workers
          if [ -f "wrangler.toml" ]; then
            echo "has_workers=true" >> $GITHUB_OUTPUT
            WORKER_NAME=$(grep '^name = ' wrangler.toml | head -1 | sed 's/name = //; s/"//g')
            echo "worker_name=$WORKER_NAME" >> $GITHUB_OUTPUT
          else
            echo "has_workers=false" >> $GITHUB_OUTPUT
          fi
          
          # Detect CI workflow
          if [ -f ".github/workflows/ci.yml" ]; then
            echo "has_ci=true" >> $GITHUB_OUTPUT
          else
            echo "has_ci=false" >> $GITHUB_OUTPUT
          fi
          
          # Detect frontend
          if [ -d "src/frontend" ]; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
            FRONTEND_DIRS=$(find src/frontend -maxdepth 1 -type d -not -path "src/frontend" | xargs -I {} basename {} | tr '\n' ',' | sed 's/,$//')
            echo "frontend_dirs=$FRONTEND_DIRS" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
          fi
          
          # Detect backend
          if [ -d "src/backend" ]; then
            echo "has_backend=true" >> $GITHUB_OUTPUT
          else
            echo "has_backend=false" >> $GITHUB_OUTPUT
          fi
          
          echo "detection completed"

      - name: Create initialization issue
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const fullName = `${owner}/${repo}`;
            
            const hasWorkers = '${{ steps.detect.outputs.has_workers }}' === 'true';
            const hasCI = '${{ steps.detect.outputs.has_ci }}' === 'true';
            const hasFrontend = '${{ steps.detect.outputs.has_frontend }}' === 'true';
            const hasBackend = '${{ steps.detect.outputs.has_backend }}' === 'true';
            const workerName = '${{ steps.detect.outputs.worker_name }}';
            const frontendDirs = '${{ steps.detect.outputs.frontend_dirs }}';
            
            let body = `# 🚀 Repository Initialization Complete
            
Repository: \`${fullName}\`
            
This repository has been successfully initialized from the template. Here's what has been configured:
            
## 📁 Repository Structure
            
`;
            
            if (hasFrontend) {
              body += `### Frontend Architecture
              - \`src/frontend/\` - Frontend application structure
              - Available directories: ${frontendDirs}
              - Each directory has its own README with specific guidelines
              - Includes: pages, components, styles, assets, lib
              
`;
            }
            
            if (hasBackend) {
              body += `### Backend Architecture
              - \`src/backend/\` - Backend feature modules
              - Feature-based organization
              - Functions imported in main \`index.js\`
              - README available with backend structure guidelines
              
`;
            }
            
            if (hasWorkers) {
              body += `## ⚙️ Cloudflare Workers Configuration
              
### Current Configuration
              - **Worker Name**: \`${workerName}\`
              - **Entry Point**: \`src/index.js\`
              - **Assets**: \`./src/frontend\` (bound to ASSETS)
              - **Observability**: Full logging and tracing enabled
              - **Node.js Compatibility**: Enabled
              
### Required Actions
              1. Install dependencies: \`npm install\`
              2. Authenticate with Cloudflare: \`npx wrangler login\`
              3. Update worker name in \`wrangler.toml\`
              4. Deploy to Cloudflare: \`npx wrangler deploy\`
              5. Configure environment variables if needed
              
`;
            }
            
            if (hasCI) {
              body += `## 🔄 CI/CD Pipeline
              
### GitHub Actions Configuration
              - **Workflow**: \`.github/workflows/ci.yml\`
              - **Triggers**: Pull requests and pushes to \`main\`
              - **Included Jobs**:
                - Test automation
                - Code linting
                - Security scanning
              
### Configuration Required
              1. Add test commands in the "Run tests" step
              2. Configure linting rules in the "Lint" step
              3. Set up security scanning tools
              4. Enable branch protection on \`main\` branch
              5. Configure required status checks
              
`;
            }
            
            body += `## 🏗️ Development Architecture
            
This repository uses **Trunk-Based Development**, the industry standard used by major organizations (Google, Meta, Netflix, Microsoft, etc.).
            
### Branch Strategy
              - \`main\` - Single permanent branch (production)
              - \`feature/*\` - Temporary feature branches (1-3 days max)
              - \`bugfix/*\` - Temporary bug fix branches (1-2 days)
              - \`hotfix/*\` - Urgent production fixes (hours only)
              
### Development Process
              1. Create feature branch from \`main\`
              2. Develop and commit on feature branch
              3. Create Pull Request to \`main\`
              4. Automated CI/CD runs (tests + linting + security)
              5. Team code review
              6. Merge to \`main\` after approval
              7. Automatic deployment to production
              
### Documentation
              See \`ARCHITECTURE.md\` for comprehensive details:
              - When and how to create branches
              - Git commands and naming conventions
              - Complete workflow examples
              - Best practices and troubleshooting
              - Branch management guidelines
              
## ✅ Administrator Setup Checklist
              
### GitHub Configuration
              - [ ] Enable branch protection on \`main\`
              - [ ] Require pull request reviews (minimum 1 reviewer)
              - [ ] Require status checks to pass before merge
              - [ ] Require branches to be up to date before merging
              - [ ] Restrict direct pushes to \`main\`
              - [ ] Configure required reviewers (if needed)
              
### Team Management
              - [ ] Create GitHub Teams for your organization
              - [ ] Set appropriate repository permissions for each team
              - [ ] Configure team access levels (read, write, admin)
              - [ ] Set up team synchronization if needed
              
### CI/CD Customization
              - [ ] Add project-specific test commands
              - [ ] Configure linting rules and standards
              - [ ] Set up security scanning tools
              - [ ] Add deployment stages (staging, production)
              - [ ] Configure notification settings
              
### Documentation Updates
              - [ ] Update \`README.md\` with project information
              - [ ] Customize \`ARCHITECTURE.md\` if needed
              - [ ] Add project-specific guidelines
              - [ ] Update contributing guidelines
              
### Cloudflare Workers Setup (if applicable)
              - [ ] Create Cloudflare account
              - [ ] Configure wrangler authentication
              - [ ] Update environment variables
              - [ ] Set up KV namespace if needed
              - [ ] Configure R2 bucket if needed
              - [ ] Set up D1 database if needed
              - [ ] Configure custom domains
              
## 📚 Resources and Documentation
              
### Official Documentation
              - [Cloudflare Workers Docs](https://developers.cloudflare.com/workers/)
              - [GitHub Actions Documentation](https://docs.github.com/en/actions)
              - [GitHub Branch Protection](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-branch-protection-rules)
              - [Trunk-Based Development](https://trunkbaseddevelopment.com/)
              - [GitHub Flow Guide](https://guides.github.com/introduction/flow/)
              
### Template Documentation
              - Repository \`ARCHITECTURE.md\` - Complete architecture guide
              - \`README.md\` - Repository overview
              - \`src/backend/README.md\` - Backend structure guide
              - \`src/frontend/README.md\` - Frontend structure guide
              - Frontend subdirectory READMEs for specific guidelines
              
### Getting Help
              - Check template documentation first
              - Review official documentation links
              - Contact DevOps team for CI/CD issues
              - Contact Cloudflare support for Workers issues
              
---
              
*This issue was automatically generated during repository initialization to guide administrators through the setup process.*
              
**Generated**: ${new Date().toISOString()}
`;
            
            github.rest.issues.create({
              owner: owner,
              repo: repo,
              title: '🚀 Repository Initialization Complete',
              body: body,
              labels: ['setup', 'initialization', 'admin']
            });
            
            console.log('Initialization issue created successfully for', fullName);